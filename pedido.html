<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedir delivery | Cantina da Bea</title><meta name="description" content="Faça seu pedido de delivery da Cantina da Bea pelo WhatsApp.">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--or:#E07B1F;--gr:#2F5130;--cr:#F6E8D0;--ink:#3B2A1A}
*{box-sizing:border-box;margin:0}
body{font-family:Nunito,sans-serif;background:var(--cr);color:var(--ink);line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}
header{background:rgba(246,232,208,.94);border-bottom:2px solid rgba(47,81,48,.12)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1120px}
.logo{font-family:Pacifico,cursive;font-size:26px;color:var(--or)}.logo b{color:var(--gr);font-weight:400}
.back{font-weight:800;color:var(--gr)}
main{padding:36px 0 56px}
.tag{font-family:Pacifico,cursive;color:#BF620E;font-size:24px}
h1{font-size:clamp(32px,7vw,46px);line-height:1.08;font-weight:900;color:var(--gr);margin:4px 0 10px}
.lead{font-size:18px}
form{background:#fff;border-radius:28px;padding:28px 24px;margin-top:26px;box-shadow:0 10px 24px rgba(59,42,26,.12);display:grid;gap:18px}
.row{display:grid;grid-template-columns:1fr 120px;gap:14px}
label{display:block;font-weight:900;color:var(--gr);margin-bottom:6px}
label small{font-weight:600;color:#7a6650}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#FBF5EA;border:2px solid #E6D3B3;border-radius:16px;padding:13px 15px;transition:border-color .15s}
textarea{resize:vertical;min-height:92px}
input:focus,textarea:focus{outline:none;border-color:var(--or);background:#fff}
input.err{border-color:#C0392B}
.msg{color:#C0392B;font-weight:800;font-size:15px;display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;cursor:pointer;font:inherit;font-size:18px;background:#19763F;color:#fff;font-weight:900;border-radius:999px;padding:16px 26px;box-shadow:0 6px 0 #0f4f29;transition:.15s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0f4f29}
.note{font-size:14px;text-align:center;color:#6b5843}
@media(max-width:420px){.row{grid-template-columns:1fr 96px}form{padding:24px 18px}}
</style></head><body>
<header><div class="wrap"><a class="logo" href="index.html">Cantina da <b>Bea</b></a><a class="back" href="index.html#delivery">← Voltar</a></div></header>
<main><div class="wrap">
<span class="tag">delivery</span>
<h1>Seu almoço quentinho em casa</h1>
<p class="lead">Preencha os dados abaixo e toque no botão. A mensagem vai pronta para o nosso WhatsApp.</p>
<form id="f" novalidate>
<div><label for="nome">Nome</label><input id="nome" name="nome" autocomplete="name" required></div>
<div class="row">
<div><label for="end">Endereço</label><input id="end" name="end" autocomplete="address-line1" placeholder="Rua, avenida, bairro" required></div>
<div><label for="num">Número</label><input id="num" name="num" inputmode="numeric" required></div>
</div>
<div><label for="ref">Ponto de referência <small>(opcional)</small></label><input id="ref" name="ref" placeholder="Ex.: casa de muro verde, perto do mercado"></div>
<div><label for="ped">Seu pedido <small>(opcional)</small></label><textarea id="ped" name="ped" placeholder="Ex.: 2 marmitas do dia e 1 suco verde"></textarea></div>
<p class="msg" id="msg">Preencha nome, endereço e número.</p>
<button class="btn" type="submit"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>Enviar pedido pelo WhatsApp</button>
<p class="note">Entregas de segunda a sábado, na hora do almoço.</p>
</form>
</div></main>
<script>
var f=document.getElementById('f'),ids=['nome','end','num','ref'];
try{var s=JSON.parse(localStorage.getItem('cantina-pedido')||'{}');ids.forEach(function(k){if(s[k])f[k].value=s[k]})}catch(e){}
f.addEventListener('submit',function(e){
e.preventDefault();
var v={};['nome','end','num','ref','ped'].forEach(function(k){v[k]=f[k].value.trim();f[k].classList.remove('err')});
var falta=['nome','end','num'].filter(function(k){return!v[k]});
falta.forEach(function(k){f[k].classList.add('err')});
document.getElementById('msg').style.display=falta.length?'block':'none';
if(falta.length){f[falta[0]].focus();return}
try{var s={};ids.forEach(function(k){s[k]=v[k]});localStorage.setItem('cantina-pedido',JSON.stringify(s))}catch(e){}
var t='Olá, Cantina da Bea! Quero fazer um pedido de delivery.\n\n*Nome:* '+v.nome+'\n*Endereço:* '+v.end+', nº '+v.num;
if(v.ref)t+='\n*Ponto de referência:* '+v.ref;
if(v.ped)t+='\n*Pedido:* '+v.ped;
location.href='https://wa.me/5545991430148?text='+encodeURIComponent(t);
});
</script>
</body></html>
